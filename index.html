<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glühwein-Tour</title>
<meta name="description" content="Glühweinbuden auf dem Stuttgarter Weihnachtsmarkt bewerten – Geschmack, Sortiment, Optik, Service.">
<meta name="theme-color" content="#1a1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Glühwein">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column for one-handed use at night – sticky header with tabs, fixed save bar with the live total at the bottom. Single dark look by choice (night market, glare-free). */
:root {
  --bg: #1a1220;
  --surface: #251a2d;
  --surface-2: #31233b;
  --line: #46344f;
  --fg: #f7ede6;
  --muted: #b5a3b3;
  --wine: #c9374f;
  --wine-deep: #6f1c2f;
  --amber: #f4ad42;
  --amber-ink: #2b1606;
  --display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 400 16px/1.45 var(--body);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Header */
header.top {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px);
}
header.top .wrap { padding-block: 12px 10px; display: flex; flex-direction: column; gap: 10px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font: 800 1.4rem/1.1 var(--display); letter-spacing: -0.01em; white-space: nowrap; }
.brand h1 span { color: var(--amber); }
.today { font-size: 0.8rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.today b { color: var(--fg); font-weight: 600; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface); border-radius: 12px; padding: 4px; }
.tabs button {
  border: 0; background: transparent; padding: 9px 8px; border-radius: 9px;
  font-weight: 600; font-size: 0.95rem; color: var(--muted);
}
.tabs button[aria-selected="true"] { background: var(--surface-2); color: var(--fg); box-shadow: inset 0 -2px 0 var(--amber); }
.status { font-size: 0.8rem; color: var(--amber); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.status:empty { display: none; }
.status button { border: 1px solid var(--amber); background: transparent; color: var(--amber); border-radius: 999px; padding: 4px 10px; font-size: 0.78rem; font-weight: 600; }

main .wrap { padding-block: 16px calc(140px + env(safe-area-inset-bottom, 0px)); }
.view { display: flex; flex-direction: column; gap: 18px; }

/* Fields */
.field { display: flex; flex-direction: column; gap: 8px; position: relative; }
.label, label { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.opt { text-transform: none; letter-spacing: 0; font-weight: 400; }
input[type="text"], input[type="search"] {
  width: 100%; min-width: 0; font: 500 1.05rem var(--body); color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 13px 14px; appearance: none; -webkit-appearance: none;
}
input::placeholder { color: #8a7889; }
input[type="text"]:focus, input[type="search"]:focus { border-color: var(--amber); outline: none; }

.suggest { display: flex; flex-wrap: wrap; gap: 6px; }
.suggest button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 7px 12px; font-size: 0.9rem; }
.banner { border-radius: 12px; padding: 12px 14px; font-size: 0.92rem; display: flex; flex-direction: column; gap: 8px; }
.banner strong { font-weight: 600; }
.banner .row { display: flex; gap: 8px; flex-wrap: wrap; }
.known { background: color-mix(in srgb, var(--amber) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent); }
.editing { background: color-mix(in srgb, var(--wine) 18%, var(--surface)); border: 1px solid color-mix(in srgb, var(--wine) 50%, transparent); }
.link-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 0.85rem; font-weight: 600; }

.who { display: flex; gap: 8px; flex-wrap: wrap; }
.who button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 0.95rem; color: var(--muted); }
.who button[aria-pressed="true"] { background: var(--wine-deep); border-color: var(--wine); color: var(--fg); }
.who button[aria-pressed="true"]::before { content: "✓ "; }

/* Criteria cards */
.crits { display: flex; flex-direction: column; gap: 14px; }
.crit { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 12px 12px; display: flex; flex-direction: column; gap: 12px; }
.crit-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.crit-head h2 { margin: 0; font: 600 1.15rem/1.2 var(--display); }
.crit-head p { margin: 2px 0 0; font-size: 0.82rem; color: var(--muted); }
.crit-avg { min-width: 56px; text-align: center; border-radius: 10px; padding: 6px 8px; background: var(--surface-2); font: 800 1.2rem/1 var(--display); font-variant-numeric: tabular-nums; }
.crit-avg small { display: block; font: 500 0.62rem/1.2 var(--body); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 3px; }
.prow { display: flex; flex-direction: column; gap: 6px; }
.pname { font-size: 0.85rem; font-weight: 600; display: flex; justify-content: space-between; }
.pname span { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.scale { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.scale button {
  border: 1px solid var(--line); background: var(--bg); border-radius: 8px;
  height: 42px; padding: 0; font-weight: 600; font-size: 0.95rem; font-variant-numeric: tabular-nums;
  touch-action: manipulation;
}
.scale button[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); }
.scale.done button[aria-pressed="false"] { color: var(--muted); }
.ghost { align-self: center; border: 0; background: transparent; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 8px; font-size: 0.9rem; }

/* Save bar */
.savebar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.savebar .wrap { padding-block: 10px; display: flex; align-items: center; gap: 12px; }
.total { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.total .lbl { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.total .val { display: flex; align-items: baseline; gap: 8px; }
.total strong { font: 800 2rem/1 var(--display); font-variant-numeric: tabular-nums; color: var(--amber); }
.total .of { font-size: 0.85rem; color: var(--muted); }
.total .prog { font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.primary { border: 0; border-radius: 14px; padding: 15px 22px; font-weight: 700; font-size: 1.02rem; background: var(--wine); color: #fff; flex: none; }
.primary:disabled { background: var(--surface-2); color: #8a7889; cursor: not-allowed; }

/* List */
.listtools { display: flex; flex-direction: column; gap: 10px; }
.sort { display: flex; gap: 6px; flex-wrap: wrap; }
.sort button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 0.88rem; font-weight: 600; color: var(--muted); }
.sort button[aria-pressed="true"] { color: var(--fg); border-color: var(--amber); }
ol.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.bude { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.bude-head { width: 100%; border: 0; background: transparent; text-align: left; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 12px; }
.rank { font: 800 1rem/1 var(--display); color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.rank.medal { color: var(--amber); }
.bname { min-width: 0; font-weight: 600; font-size: 1.02rem; overflow-wrap: anywhere; }
.bname small { display: block; font-weight: 400; font-size: 0.8rem; color: var(--muted); }
.score { min-width: 58px; text-align: center; border-radius: 12px; padding: 8px 6px; font: 800 1.35rem/1 var(--display); font-variant-numeric: tabular-nums; }
.tone-top { background: var(--amber); color: var(--amber-ink); }
.tone-mid { background: color-mix(in srgb, var(--amber) 22%, var(--surface-2)); color: var(--fg); }
.tone-low { background: color-mix(in srgb, var(--wine) 35%, var(--surface-2)); color: var(--fg); }
.bude-body { padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 14px; border-top: 1px solid var(--line); }
.bars { display: flex; flex-direction: column; gap: 7px; }
.bar { display: grid; grid-template-columns: 78px minmax(0, 1fr) 34px; gap: 8px; align-items: center; font-size: 0.85rem; }
.bar .track { height: 8px; border-radius: 4px; background: var(--bg); overflow: hidden; }
.bar .fill { height: 100%; background: var(--amber); border-radius: 4px; }
.bar b { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.visit { background: var(--bg); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.visit-head { display: flex; justify-content: space-between; gap: 8px; font-size: 0.85rem; }
.visit-head span { color: var(--muted); }
.visit-head b { font-variant-numeric: tabular-nums; }
.grid-scroll { overflow-x: auto; }
table.pp { width: 100%; border-collapse: collapse; font-size: 0.82rem; font-variant-numeric: tabular-nums; }
table.pp th, table.pp td { padding: 4px; text-align: center; }
table.pp th { color: var(--muted); font-weight: 500; font-size: 0.72rem; }
table.pp td:first-child, table.pp th:first-child { text-align: left; }
table.pp tr.avg td { border-top: 1px solid var(--line); font-weight: 700; color: var(--amber); }
.note { font-size: 0.88rem; background: var(--surface); border-radius: 8px; padding: 8px 10px; overflow-wrap: anywhere; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 0.85rem; font-weight: 600; }
.actions button.danger { color: #ffb3bf; }
.actions button.danger.armed { background: var(--wine); color: #fff; border-color: var(--wine); }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; border: 1px dashed var(--line); border-radius: 16px; }
.empty b { display: block; color: var(--fg); font: 600 1.1rem var(--display); margin-bottom: 4px; }
.foot { font-size: 0.8rem; color: var(--muted); text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; padding-top: 8px; }
.foot button { border: 0; background: none; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 0.8rem; padding: 4px; }

/* Setup */
.setup { padding-top: 24px; }
.setup h2 { margin: 0; font: 800 1.5rem/1.15 var(--display); }
.setup p { margin: 0; color: var(--muted); }
.setup .err { color: #ffb3bf; font-size: 0.9rem; }
.setup .primary { width: 100%; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 8;
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px;
  font-weight: 600; font-size: 0.92rem; width: max-content; max-width: calc(100% - 32px); text-align: center;
  box-shadow: 0 8px 24px rgba(0,0,0,.4);
}
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: pop .18s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, 8px); } }
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Glühwein-<span>Tour</span></h1>
      <div class="today" id="today">Heute: <b>0</b> Buden</div>
    </div>
    <div class="tabs" role="tablist" id="tabs">
      <button id="tab-rate" type="button" role="tab" aria-selected="true" aria-controls="view-rate">Bewerten</button>
      <button id="tab-list" type="button" role="tab" aria-selected="false" aria-controls="view-list">Rangliste</button>
    </div>
    <div class="status" id="status"></div>
  </div>
</header>

<main>
  <div class="wrap">
    <section id="view-setup" class="view setup" hidden>
      <h2>Gruppen-Code eingeben</h2>
      <p>Mit dem Code landen eure Bewertungen in derselben Liste – auf allen Handys. Ihr braucht ihn nur einmal pro Handy.</p>
      <div class="field">
        <label for="code">Gruppen-Code</label>
        <input id="code" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="z. B. ab12cd34ef56">
      </div>
      <div class="err" id="code-err" hidden></div>
      <button id="code-go" class="primary" type="button">Los geht’s</button>
    </section>

    <section id="view-rate" class="view" role="tabpanel" aria-labelledby="tab-rate">
      <div id="editing" class="banner editing" hidden></div>
      <div class="field">
        <label for="bude">Name der Bude</label>
        <input id="bude" type="text" autocomplete="off" autocapitalize="words" enterkeyhint="done" placeholder="z. B. Zum Glühweinengel">
        <div id="suggest" class="suggest" hidden></div>
        <div id="known" class="banner known" hidden></div>
      </div>
      <div class="field">
        <span class="label">Wer trinkt mit?</span>
        <div class="who" id="who"></div>
      </div>
      <div id="crits" class="crits"></div>
      <div class="field">
        <label for="notiz">Notiz <span class="opt">(optional)</span></label>
        <input id="notiz" type="text" autocomplete="off" placeholder="Preis, Pfand, Besonderheit …">
      </div>
      <button id="reset" class="ghost" type="button">Formular leeren</button>
    </section>

    <section id="view-list" class="view" role="tabpanel" aria-labelledby="tab-list" hidden>
      <div class="listtools">
        <input id="search" type="search" autocomplete="off" placeholder="Bude suchen …" aria-label="Bude suchen">
        <div class="sort" id="sort">
          <button type="button" data-sort="score" aria-pressed="true">Beste zuerst</button>
          <button type="button" data-sort="recent" aria-pressed="false">Zuletzt besucht</button>
          <button type="button" data-sort="name" aria-pressed="false">A–Z</button>
        </div>
      </div>
      <ol class="list" id="list"></ol>
      <div class="empty" id="empty" hidden></div>
      <div class="foot" id="foot"></div>
    </section>
  </div>
</main>

<div class="savebar" id="savebar">
  <div class="wrap">
    <div class="total">
      <span class="lbl">Gesamtnote</span>
      <div class="val"><strong id="total">–</strong><span class="of">/ 10</span></div>
      <span class="prog" id="progress"></span>
    </div>
    <button id="save" class="primary" type="button" disabled>Speichern</button>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module">
/* ---------- Konfiguration ---------- */
// Firebase-Web-Config aus der Firebase-Konsole (öffentlich; Schutz über die Firestore-Regeln + Gruppen-Code).
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBBCDmny8sbs-aF5Fbuy3C03IV_k4E8UMA",
  authDomain: "gluehwein-tour.firebaseapp.com",
  projectId: "gluehwein-tour",
  storageBucket: "gluehwein-tour.firebasestorage.app",
  messagingSenderId: "1033990092878",
  appId: "1:1033990092878:web:a279a92127f75321edab1f"
};
const FIREBASE_VERSION = "10.12.2";

const PEOPLE = ["Fiete", "Jonathan", "Samson"];
const CRIT = [
  { k: "geschmack", t: "Geschmack", s: "Wie schmeckt der Glühwein?", short: "Geschm." },
  { k: "sortiment", t: "Sortiment", s: "Wie breit ist die Auswahl der Bude?", short: "Sortim." },
  { k: "optik", t: "Optik", s: "Wie schön ist die Bude?", short: "Optik" },
  { k: "service", t: "Service", s: "Freundlich, schnell, kompetent?", short: "Service" }
];
const LOCAL_KEY = "gw-tour-bewertungen";
const DRAFT_KEY = "gw-tour-draft";
const CODE_KEY = "gw-tour-code";

/* ---------- Helfer ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (v) => (v == null || isNaN(v)) ? "–" : (Math.round(v * 10) / 10).toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const round2 = (v) => Math.round(v * 100) / 100;
function mean(arr) {
  const a = arr.filter((x) => typeof x === "number" && !isNaN(x));
  return a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
}
const keyOf = (name) => String(name || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "")
  .replace(/ß/g, "ss").replace(/[^a-z0-9]+/g, " ").trim();
const tone = (v) => v >= 8 ? "tone-top" : v >= 6 ? "tone-mid" : "tone-low";
// Ein Tour-Abend geht über Mitternacht: bis 6 Uhr zählt noch zum Vortag.
const tourDay = (ts) => { const d = new Date(ts - 6 * 3600e3); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; };
const dateLabel = (ts) => { const d = new Date(ts); return d.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" }) + " · " + d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }); };
const shortDate = (ts) => new Date(ts).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "2-digit" });
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch {} }
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

let toastTimer = null;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
}

/* ---------- Speicher: Firebase (synchron) oder nur dieses Handy ---------- */
const store = {
  mode: "loading",       // loading | local | sync
  items: [],
  fromCache: false,
  pending: false,
  error: "",
  code: null,
  fs: null, col: null, unsub: null,
};

function useLocal() {
  store.mode = "local";
  store.items = lsGet(LOCAL_KEY, []);
  renderAll();
}

async function initStore() {
  if (!FIREBASE_CONFIG) { useLocal(); return; }
  const hashCode = (location.hash.match(/code=([a-z0-9-]+)/i) || [])[1];
  if (hashCode) { lsSet(CODE_KEY, hashCode.toLowerCase()); history.replaceState(null, "", location.pathname); }
  store.code = lsGet(CODE_KEY, null);
  if (!store.code) { showSetup(); return; }
  try {
    const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-app.js`);
    const fs = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-firestore.js`);
    const app = initializeApp(FIREBASE_CONFIG);
    let db;
    try {
      db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) });
    } catch { db = fs.getFirestore(app); }
    store.fs = fs;
    store.col = fs.collection(db, "touren", store.code, "bewertungen");
    store.mode = "sync";
    store.unsub = fs.onSnapshot(store.col, { includeMetadataChanges: true }, (snap) => {
      store.items = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
      store.fromCache = snap.metadata.fromCache;
      store.pending = snap.metadata.hasPendingWrites;
      store.error = "";
      renderAll();
    }, (err) => {
      if (err && err.code === "permission-denied") {
        lsDel(CODE_KEY);
        showSetup("Der Gruppen-Code stimmt nicht. Bitte nochmal eingeben.");
        return;
      }
      store.error = "Verbindung zur gemeinsamen Liste verloren. App neu öffnen.";
      renderStatus();
    });
  } catch (e) {
    console.error(e);
    store.error = "Sync konnte nicht starten (kein Netz?). Gespeichert wird erstmal nur auf diesem Handy.";
    useLocal();
  }
}

function persist(id, obj) {
  if (store.mode === "sync") {
    const { fs, col } = store;
    const ref = id ? fs.doc(col, id) : fs.doc(col);
    // Nicht auf den Server warten: offline landet der Eintrag sofort lokal und wird später übertragen.
    fs.setDoc(ref, obj).catch(handleWriteError);
    return;
  }
  const items = store.items.slice();
  if (id) {
    const i = items.findIndex((x) => x.id === id);
    if (i >= 0) items[i] = { ...obj, id };
  } else {
    items.push({ ...obj, id: "l" + newId() });
  }
  store.items = items; lsSet(LOCAL_KEY, items); renderAll();
}
function removeEntry(id) {
  if (store.mode === "sync") {
    store.fs.deleteDoc(store.fs.doc(store.col, id)).catch(handleWriteError);
    return;
  }
  store.items = store.items.filter((x) => x.id !== id);
  lsSet(LOCAL_KEY, store.items); renderAll();
}
function handleWriteError(e) {
  console.error(e);
  if (e && e.code === "permission-denied") toast("Nicht gespeichert: Gruppen-Code ungültig.");
  else toast("Nicht gespeichert – bitte nochmal versuchen.");
}
function uploadLocal() {
  const local = lsGet(LOCAL_KEY, []);
  if (store.mode !== "sync" || !local.length) return;
  const { fs, col } = store;
  local.forEach((it) => {
    const { id, ...rest } = it;
    fs.setDoc(fs.doc(col, String(id).replace(/[^A-Za-z0-9_-]/g, "") || newId()), rest).catch(handleWriteError);
  });
  lsDel(LOCAL_KEY);
  toast(`${local.length} Bewertung${local.length === 1 ? "" : "en"} hochgeladen`);
  renderStatus();
}

/* ---------- Formular ---------- */
function emptyScores() {
  const s = {};
  PEOPLE.forEach((p) => { s[p] = {}; CRIT.forEach((c) => { s[p][c.k] = null; }); });
  return s;
}
function freshForm(name = "", present) {
  return { editId: null, editTs: null, bude: name, notiz: "", present: present || Object.fromEntries(PEOPLE.map((p) => [p, true])), scores: emptyScores() };
}
let form = lsGet(DRAFT_KEY, null);
if (!form || !form.scores || !form.present) form = freshForm();
PEOPLE.forEach((p) => {
  if (!form.scores[p]) form.scores[p] = {};
  if (form.present[p] === undefined) form.present[p] = true;
});
const saveDraft = () => lsSet(DRAFT_KEY, form);

const presentPeople = () => PEOPLE.filter((p) => form.present[p]);
const critAvg = (k) => mean(presentPeople().map((p) => form.scores[p][k]));
function filled() {
  let n = 0, total = 0;
  presentPeople().forEach((p) => CRIT.forEach((c) => { total++; if (form.scores[p][c.k] != null) n++; }));
  return { n, total };
}
function formTotal() {
  const avgs = CRIT.map((c) => critAvg(c.k));
  return avgs.some((v) => v == null) ? null : mean(avgs);
}

function buildWho() {
  $("who").innerHTML = PEOPLE.map((p) => `<button type="button" data-person="${esc(p)}" aria-pressed="false">${esc(p)}</button>`).join("");
}
function buildCrits() {
  $("crits").innerHTML = CRIT.map((c) => {
    const rows = PEOPLE.map((p) => {
      let btns = "";
      for (let i = 1; i <= 10; i++) btns += `<button type="button" data-p="${esc(p)}" data-k="${c.k}" data-v="${i}" aria-pressed="false" aria-label="${esc(p)} ${c.t} ${i}">${i}</button>`;
      return `<div class="prow" data-row="${esc(p)}"><div class="pname">${esc(p)}<span data-pv="${esc(p)}-${c.k}"></span></div><div class="scale" data-scale="${esc(p)}-${c.k}">${btns}</div></div>`;
    }).join("");
    return `<section class="crit"><div class="crit-head"><div><h2>${c.t}</h2><p>${c.s}</p></div><div class="crit-avg"><span data-avg="${c.k}">–</span><small>Schnitt</small></div></div>${rows}</section>`;
  }).join("");
}

function renderForm() {
  if ($("bude").value !== form.bude) $("bude").value = form.bude;
  if ($("notiz").value !== form.notiz) $("notiz").value = form.notiz;
  for (const b of $("who").children) b.setAttribute("aria-pressed", form.present[b.dataset.person] ? "true" : "false");
  PEOPLE.forEach((p) => {
    document.querySelectorAll(`[data-row="${p}"]`).forEach((r) => { r.hidden = !form.present[p]; });
    CRIT.forEach((c) => {
      const v = form.scores[p][c.k];
      const scale = document.querySelector(`[data-scale="${p}-${c.k}"]`);
      for (const b of scale.children) b.setAttribute("aria-pressed", Number(b.dataset.v) === v ? "true" : "false");
      scale.classList.toggle("done", v != null);
      document.querySelector(`[data-pv="${p}-${c.k}"]`).textContent = v != null ? `${v} / 10` : "";
    });
  });
  CRIT.forEach((c) => { document.querySelector(`[data-avg="${c.k}"]`).textContent = fmt(critAvg(c.k)); });
  const f = filled(), tot = formTotal();
  $("total").textContent = tot == null ? "–" : fmt(tot);
  const missing = [];
  if (!form.bude.trim()) missing.push("Name der Bude");
  if (f.n < f.total) missing.push(`${f.total - f.n} Punkte offen`);
  $("progress").textContent = presentPeople().length === 0 ? "Wähle aus, wer mittrinkt"
    : missing.length ? "Fehlt: " + missing.join(", ") : (form.editId ? "Bereit zum Aktualisieren" : "Bereit zum Speichern");
  $("save").textContent = form.editId ? "Aktualisieren" : "Speichern";
  $("save").disabled = store.mode === "loading" || !form.bude.trim() || presentPeople().length === 0 || f.n < f.total;

  const ed = $("editing");
  if (form.editId) {
    ed.hidden = false;
    ed.innerHTML = `<div>Du bearbeitest <strong>${esc(form.bude || "…")}</strong> vom ${esc(form.editTs ? shortDate(form.editTs) : "")}.</div><div class="row"><button type="button" class="link-btn" id="cancel-edit">Bearbeiten abbrechen</button></div>`;
  } else { ed.hidden = true; ed.innerHTML = ""; }
  renderKnown();
}

/* ---------- Gruppierung pro Bude ---------- */
function groups() {
  const map = {};
  store.items.forEach((it) => {
    if (!it || !it.key) return;
    (map[it.key] ||= { key: it.key, visits: [] }).visits.push(it);
  });
  const list = Object.values(map).map((g) => {
    g.visits.sort((a, b) => b.ts - a.ts);
    g.name = g.visits[0].bude;
    g.last = g.visits[0].ts;
    g.first = g.visits[g.visits.length - 1].ts;
    g.score = mean(g.visits.map((v) => v.gesamt));
    g.crit = Object.fromEntries(CRIT.map((c) => [c.k, mean(g.visits.map((v) => v.schnitt && v.schnitt[c.k]))]));
    return g;
  });
  list.sort((a, b) => (b.score - a.score) || (a.first - b.first));
  list.forEach((g, i) => { g.rank = i + 1; });
  return list;
}

function renderKnown() {
  const key = keyOf(form.bude);
  const known = $("known"), sug = $("suggest");
  if (!key) { known.hidden = true; sug.hidden = true; return; }
  const gs = groups();
  const exact = gs.find((g) => g.key === key);
  if (exact && !form.editId) {
    known.hidden = false;
    known.innerHTML = `<div>Hier wart ihr schon: <strong>${exact.visits.length}× bewertet</strong>, zuletzt am ${esc(shortDate(exact.last))} · Ø <strong>${fmt(exact.score)}</strong> (Platz ${exact.rank} von ${gs.length}). Speichern legt einen weiteren Besuch an.</div><div class="row"><button type="button" class="link-btn" data-show="${esc(exact.key)}">Bewertung ansehen</button></div>`;
  } else { known.hidden = true; known.innerHTML = ""; }
  const matches = exact ? [] : gs.filter((g) => g.key.includes(key)).slice(0, 5);
  sug.hidden = !matches.length;
  sug.innerHTML = matches.map((g) => `<button type="button" data-fill="${esc(g.name)}">${esc(g.name)}</button>`).join("");
}

/* ---------- Rangliste ---------- */
let sortMode = "score";
const openKeys = {};
let armed = null, armTimer = null;

function renderList() {
  const raw = $("search").value;
  const q = keyOf(raw);
  const gs = groups();
  const shown = gs.filter((g) => !q || g.key.includes(q));
  if (sortMode === "recent") shown.sort((a, b) => b.last - a.last);
  if (sortMode === "name") shown.sort((a, b) => a.name.localeCompare(b.name, "de"));

  const empty = $("empty");
  if (!gs.length) {
    empty.hidden = false;
    empty.innerHTML = store.mode === "loading" ? "<b>Lade Bewertungen …</b>"
      : "<b>Noch keine Bude bewertet</b>Geh zum Tab „Bewerten“, trag die erste Bude ein und gönnt euch den ersten Glühwein.";
  } else if (!shown.length) {
    empty.hidden = false;
    empty.innerHTML = `<b>Keine Bude gefunden</b>Bei „${esc(raw)}“ wart ihr noch nicht.<div style="margin-top:12px"><button type="button" class="link-btn" data-newbude="${esc(raw)}">„${esc(raw)}“ jetzt bewerten</button></div>`;
  } else { empty.hidden = true; empty.innerHTML = ""; }

  $("list").innerHTML = shown.map((g) => {
    const open = !!openKeys[g.key];
    const meta = `${g.visits.length} ${g.visits.length === 1 ? "Besuch" : "Besuche"} · zuletzt ${shortDate(g.last)}`;
    let body = "";
    if (open) {
      const bars = CRIT.map((c) => {
        const v = g.crit[c.k];
        return `<div class="bar"><span>${c.t}</span><div class="track"><div class="fill" style="width:${v == null ? 0 : Math.max(0, Math.min(100, v * 10))}%"></div></div><b>${fmt(v)}</b></div>`;
      }).join("");
      const visits = g.visits.map((v) => {
        const people = PEOPLE.filter((p) => v.einzeln && v.einzeln[p]);
        const rows = people.map((p) => `<tr><td>${esc(p)}</td>${CRIT.map((c) => `<td>${v.einzeln[p][c.k] == null ? "–" : esc(v.einzeln[p][c.k])}</td>`).join("")}</tr>`).join("");
        const avgRow = `<tr class="avg"><td>Schnitt</td>${CRIT.map((c) => `<td>${fmt(v.schnitt && v.schnitt[c.k])}</td>`).join("")}</tr>`;
        const isArmed = armed === v.id;
        return `<div class="visit"><div class="visit-head"><span>${esc(dateLabel(v.ts))}</span><b>Gesamt ${fmt(v.gesamt)}</b></div>`
          + `<div class="grid-scroll"><table class="pp"><thead><tr><th></th>${CRIT.map((c) => `<th>${c.short}</th>`).join("")}</tr></thead><tbody>${rows}${avgRow}</tbody></table></div>`
          + (v.notiz ? `<div class="note">${esc(v.notiz)}</div>` : "")
          + `<div class="actions"><button type="button" data-edit="${esc(v.id)}">Bearbeiten</button><button type="button" class="danger${isArmed ? " armed" : ""}" data-del="${esc(v.id)}">${isArmed ? "Wirklich löschen?" : "Löschen"}</button></div></div>`;
      }).join("");
      body = `<div class="bude-body"><div class="bars">${bars}</div>${visits}<div class="actions"><button type="button" data-again="${esc(g.name)}">Nochmal bewerten</button></div></div>`;
    }
    return `<li class="bude"><button type="button" class="bude-head" data-toggle="${esc(g.key)}" aria-expanded="${open}">`
      + `<span class="rank${g.rank <= 3 ? " medal" : ""}">${g.rank}</span>`
      + `<span class="bname">${esc(g.name)}<small>${esc(meta)}</small></span>`
      + `<span class="score ${tone(g.score)}">${fmt(g.score)}</span></button>${body}</li>`;
  }).join("");

  const foot = $("foot");
  if (store.mode === "sync") foot.innerHTML = `<span>Gruppe: <b>${esc(store.code)}</b></span><button type="button" id="change-code">Gruppe wechseln</button>`;
  else if (store.mode === "local") foot.innerHTML = "<span>Gespeichert nur auf diesem Handy.</span>";
  else foot.innerHTML = "";
}

function renderStatus() {
  const s = $("status");
  const localLeft = store.mode === "sync" ? lsGet(LOCAL_KEY, []).length : 0;
  const parts = [];
  if (store.error) parts.push(esc(store.error));
  else if (store.mode === "local" && !FIREBASE_CONFIG) parts.push("Gespeichert wird nur auf diesem Handy.");
  else if (store.mode === "sync" && store.pending && !navigator.onLine) parts.push("Offline – Einträge werden übertragen, sobald wieder Netz da ist.");
  else if (store.mode === "sync" && store.pending) parts.push("Wird synchronisiert …");
  else if (store.mode === "sync" && !navigator.onLine) parts.push("Offline – du siehst den letzten Stand.");
  if (localLeft) parts.push(`<span>${localLeft} Bewertung${localLeft === 1 ? "" : "en"} nur auf diesem Handy.</span><button type="button" id="upload-local">Hochladen</button>`);
  s.innerHTML = parts.join(" ");
}
function renderToday() {
  const today = tourDay(Date.now());
  const todays = store.items.filter((it) => it && it.ts && tourDay(it.ts) === today);
  const cups = todays.reduce((s, it) => s + (it.einzeln ? Object.keys(it.einzeln).length : 0), 0);
  $("today").innerHTML = `Heute: <b>${todays.length}</b> ${todays.length === 1 ? "Bude" : "Buden"} · <b>${cups}</b> Becher`;
}
function renderAll() { renderStatus(); renderToday(); renderForm(); renderList(); }

/* ---------- Ansichten ---------- */
let current = "rate";
function showTab(name) {
  current = name;
  const rate = name === "rate";
  $("view-setup").hidden = true;
  $("tabs").hidden = false;
  $("tab-rate").setAttribute("aria-selected", String(rate));
  $("tab-list").setAttribute("aria-selected", String(!rate));
  $("view-rate").hidden = !rate;
  $("view-list").hidden = rate;
  $("savebar").hidden = !rate;
  window.scrollTo(0, 0);
}
function showSetup(err) {
  if (store.unsub) { store.unsub(); store.unsub = null; }
  store.mode = "loading";
  $("view-setup").hidden = false;
  $("view-rate").hidden = true; $("view-list").hidden = true; $("savebar").hidden = true; $("tabs").hidden = true;
  $("status").innerHTML = "";
  $("code-err").hidden = !err; $("code-err").textContent = err || "";
  $("code").value = "";
}
function submitCode() {
  const c = $("code").value.trim().toLowerCase().replace(/[^a-z0-9-]/g, "");
  if (c.length < 4) { $("code-err").hidden = false; $("code-err").textContent = "Bitte den Code eingeben, den ihr in der Gruppe ausgemacht habt."; return; }
  lsSet(CODE_KEY, c);
  // Neu starten, damit Firestore sauber mit dem neuen Code verbindet.
  location.reload();
}
function startNew(name) {
  form = freshForm(name || "", form.present);
  saveDraft(); renderForm(); showTab("rate");
}

/* ---------- Events ---------- */
$("tab-rate").addEventListener("click", () => showTab("rate"));
$("tab-list").addEventListener("click", () => showTab("list"));
$("code-go").addEventListener("click", submitCode);
$("code").addEventListener("keydown", (e) => { if (e.key === "Enter") submitCode(); });

$("bude").addEventListener("input", (e) => { form.bude = e.target.value; saveDraft(); renderForm(); });
$("bude").addEventListener("keydown", (e) => { if (e.key === "Enter") e.target.blur(); });
$("notiz").addEventListener("input", (e) => { form.notiz = e.target.value; saveDraft(); });
$("notiz").addEventListener("keydown", (e) => { if (e.key === "Enter") e.target.blur(); });

$("who").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-person]"); if (!b) return;
  form.present[b.dataset.person] = !form.present[b.dataset.person];
  saveDraft(); renderForm();
});
$("crits").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-v]"); if (!b) return;
  const { p, k } = b.dataset, v = Number(b.dataset.v);
  form.scores[p][k] = form.scores[p][k] === v ? null : v;
  saveDraft(); renderForm();
});

document.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.fill != null) { form.bude = d.fill; saveDraft(); renderForm(); return; }
  if (d.show != null) { openKeys[d.show] = true; $("search").value = ""; renderList(); showTab("list"); return; }
  if (t.id === "cancel-edit") { startNew(""); return; }
  if (t.id === "upload-local") { uploadLocal(); return; }
  if (t.id === "change-code") { lsDel(CODE_KEY); showSetup(); return; }
  if (d.newbude != null) { $("search").value = ""; startNew(d.newbude); return; }
  if (d.again != null) { startNew(d.again); return; }
  if (d.toggle != null) { openKeys[d.toggle] = !openKeys[d.toggle]; renderList(); return; }
  if (d.edit != null) {
    const it = store.items.find((x) => x.id === d.edit); if (!it) return;
    const present = {}, scores = emptyScores();
    PEOPLE.forEach((p) => {
      present[p] = !!(it.einzeln && it.einzeln[p]);
      if (present[p]) CRIT.forEach((c) => { scores[p][c.k] = it.einzeln[p][c.k] ?? null; });
    });
    form = { editId: it.id, editTs: it.ts, bude: it.bude, notiz: it.notiz || "", present, scores };
    saveDraft(); renderForm(); showTab("rate"); return;
  }
  if (d.del != null) {
    const id = d.del;
    if (armed !== id) {
      armed = id; renderList();
      clearTimeout(armTimer); armTimer = setTimeout(() => { armed = null; renderList(); }, 4000);
      return;
    }
    armed = null; clearTimeout(armTimer);
    removeEntry(id);
    toast("Bewertung gelöscht");
    if (form.editId === id) startNew("");
  }
});

$("sort").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-sort]"); if (!b) return;
  sortMode = b.dataset.sort;
  for (const x of $("sort").children) x.setAttribute("aria-pressed", String(x === b));
  renderList();
});
$("search").addEventListener("input", renderList);

$("reset").addEventListener("click", () => {
  if (form.editId) { startNew(""); return; }
  form = freshForm("", form.present);
  saveDraft(); renderForm(); window.scrollTo(0, 0);
});

$("save").addEventListener("click", () => {
  if ($("save").disabled) return;
  const people = presentPeople();
  const einzeln = {}, schnitt = {};
  people.forEach((p) => { einzeln[p] = {}; CRIT.forEach((c) => { einzeln[p][c.k] = form.scores[p][c.k]; }); });
  CRIT.forEach((c) => { schnitt[c.k] = round2(critAvg(c.k)); });
  const gesamt = round2(mean(CRIT.map((c) => critAvg(c.k))));
  const name = form.bude.trim().replace(/\s+/g, " ");
  const obj = { bude: name, key: keyOf(name), ts: form.editId ? form.editTs : Date.now(), schnitt, einzeln, gesamt, notiz: form.notiz.trim() };
  const wasEdit = !!form.editId;
  persist(form.editId, obj);
  form = freshForm("", form.present);
  saveDraft(); renderAll(); window.scrollTo(0, 0);
  const g = groups().find((x) => x.key === obj.key);
  toast(`${wasEdit ? "Aktualisiert" : "Prost!"} ${name} · ${fmt(gesamt)}${g ? " · Platz " + g.rank : ""}`);
});

addEventListener("online", renderStatus);
addEventListener("offline", renderStatus);

// Bildschirm beim Bewerten anlassen, wo das Handy es erlaubt.
function requestWake() {
  try { if (navigator.wakeLock && document.visibilityState === "visible") navigator.wakeLock.request("screen").catch(() => {}); } catch {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") requestWake(); });
document.addEventListener("click", requestWake, { once: true });

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

buildWho(); buildCrits(); renderAll();
initStore();
</script>
</body>
</html>
